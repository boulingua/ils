# ─────────────────────────────────────────────────────────────────────────
# ils — Italiano come Lingua Straniera. Instantiated from `pagegen`, the
# canonical boulingua course template (Hugo + hugo-coder).
#
# Only the values marked CHANGE in pagegen's hugo.toml were touched; the rest
# is the shared standard and is kept byte-identical so template updates can be
# merged back cleanly. UI labels are Italian; the three statutory legal pages
# stay German (they are law, not content) — see ROADMAP §9.
# ─────────────────────────────────────────────────────────────────────────

baseURL = "https://boulingua.github.io/ils/"
title = "Italiano come Lingua Straniera — S. Le Boulanger"
languageCode = "it"
defaultContentLanguage = "it"
enableEmoji = false
enableRobotsTXT = true

[pagination]
  pagerSize = 20

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

# Tags are DECLARED, not implicit — derive them from structured fields.
[taxonomies]
  tag = "tags"
  skill = "skills"
  level = "levels"
  topic = "topics"

[params]
  navTitle = "Italiano"
  author = "S. Le Boulanger"
  description = "Corso aperto di italiano come lingua straniera, dal livello pre-A1 al C1: unità curricolari, prove modello, materiali scaricabili e audio con voce nativa."
  keywords = "italiano,italiano L2,ILS,QCER,CEFR,pre-A1,A1,A2,B1,B2,C1,curriculum,OER,Gesamtschule"
  dateFormat = "2006-01-02"
  since = 2026
  colorScheme = "auto"
  hideCredits = true
  # The colour-scheme toggle is a labelled control in the navbar
  # (layouts/_partials/header.html); disable the theme's floating duplicate
  # so there is exactly one toggle on the page.
  hideColorSchemeToggle = true
  customCSS = ["css/custom.css"]
  # Site code — selects this course's accent from data/accents.yaml
  # (ils → #8023C7 light / #B97EE7 dark, pentagon mark).
  code = "ils"
  # Content licence, surfaced by pdf attribution + legal pages.
  license = "CC BY-SA 4.0"

  # IMPORTANT — every sub-table under [params] MUST come AFTER all bare
  # [params] keys. TOML scopes everything after a header to that header, so
  # opening [params.plausible] before the keys above would silently move them
  # under params.plausible and leave the site unstyled. Keep this block LAST.
  [params.plausible]
    # Privacy-friendly, cookieless analytics on the author's self-hosted
    # instance (server in Germany) — see /datenschutz/.
    domain = "boulingua.github.io/ils"
    src = "https://analytics.hellebo.de/js/script.file-downloads.outbound-links.js"

[[params.social]]
  name = "GitHub"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/boulingua/ils"

